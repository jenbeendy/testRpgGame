version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rpggame
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    environment:
      DATABASE_URL: "postgres://postgres:password@postgres:5432/rpggame?sslmode=disable"
      JWT_SECRET: "dev-secret-key-change-in-production"
      PORT: "8001"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  crafting-service:
    build:
      context: .
      dockerfile: ./services/crafting-service/Dockerfile
    environment:
      DATABASE_URL: "postgres://postgres:password@postgres:5432/rpggame?sslmode=disable"
      INVENTORY_SERVICE_URL: "http://inventory-service:8003"
      JWT_SECRET: "dev-secret-key-change-in-production"
      PORT: "8002"
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_started
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: ./services/inventory-service/Dockerfile
    environment:
      DATABASE_URL: "postgres://postgres:password@postgres:5432/rpggame?sslmode=disable"
      PORT: "8003"
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  admin-service:
    build:
      context: .
      dockerfile: ./services/admin-service/Dockerfile
    environment:
      DATABASE_URL: "postgres://postgres:password@postgres:5432/rpggame?sslmode=disable"
      PORT: "8004"
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
